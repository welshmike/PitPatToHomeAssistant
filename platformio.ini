; Flash DevKit via USB:   pio run -e devkit-usb -t upload
; Flash DevKit via OTA:   pio run -e devkit-ota -t upload
; Flash Dial via USB:     pio run -e dial-usb -t upload
; Unit tests (host):      pio test -e native
; Monitor:                pio device monitor -e <env>

[platformio]
default_envs = devkit-usb

[common]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -Wno-cpp
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
    https://github.com/peteh/mqttdisco.git

[devkit]
extends = common
board = esp32dev
board_build.partitions = partitions.csv
monitor_port = /dev/cu.usbserial-0001
upload_port = /dev/cu.usbserial-0001   ; pin so the Dial's usbmodem is never auto-picked
monitor_rts = 0
monitor_dtr = 0
build_flags = ${common.build_flags} -DBOARD_DEVKIT

[env:devkit-usb]
extends = devkit
upload_speed = 115200

[env:devkit-ota]
extends = devkit
upload_protocol = espota
upload_port = esp32-ece33445ef18.local

[dial]
extends = common
board = m5stack-stamps3
board_build.partitions = partitions_8mb.csv
build_flags = ${common.build_flags}
    -DBOARD_M5DIAL
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDIAL_SOUND=1
lib_deps = ${common.lib_deps}
    m5stack/M5Dial@^1.0.3
    m5stack/M5Unified
    m5stack/M5GFX

[env:dial-usb]
extends = dial

[env:dial-ota]
extends = dial
upload_protocol = espota
upload_port = pacekeeper-dial.local

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DNATIVE_TEST
build_src_filter = +<ba05protocol.cpp> +<SessionTracker.cpp> +<TreadmillController.cpp> +<DialInput.cpp>
test_build_src = yes
