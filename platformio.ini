; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2  ; NimBLE warnings/errors only — suppresses "Write complete" spam
    -Wno-cpp                          ; suppress BLE_MESH_MAX_CONN redefinition (NimBLE/framework conflict)
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
    https://github.com/peteh/mqttdisco.git

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -Wno-cpp
    -DARDUINO_USB_MODE=1          ; enable USB-CDC mode
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial over USB-CDC (no separate UART chip)
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
    https://github.com/peteh/mqttdisco.git